[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ditus-kablo-analizor"
dynamic = ["version"]
description = "DiTuS Kablo Analizör engineering analysis application"
readme = "README_TR.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6==6.11.0",
    "ezdxf==1.4.4",
    "numpy==2.5.1; python_version >= '3.12'",
    "numpy==2.3.5; python_version < '3.12'",
    "scipy==1.17.0",
    "networkx>=3.4,<4",
    "matplotlib>=3.10,<4",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "pydantic>=2.11,<3",
    "python-docx>=1.2,<2",
    "reportlab>=4.4,<5",
    "pypdf>=5.9,<7",
    "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
    "openpyxl>=3.1,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ucd.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ucd*"]

[tool.setuptools.package-data]
"ucd.resources" = ["*.json", "catalogs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Release-blocking correctness rules first; legacy style debt can be tightened
# incrementally without disabling the CI gate.
select = ["E9", "F63", "F7", "F82"]
